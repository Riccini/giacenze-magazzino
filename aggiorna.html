<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{background:#fff;border-radius:12px;padding:2rem;max-width:480px;width:100%;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
h1{font-size:20px;font-weight:600;margin-bottom:0.25rem}
.sub{font-size:13px;color:#666;margin-bottom:2rem}
.step{margin-bottom:1.5rem}
.step-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px;color:#999;margin-bottom:6px}
.upload-zone{border:2px dashed #e0e0e0;border-radius:10px;padding:1.5rem;text-align:center;cursor:pointer;transition:all 0.15s;background:#fafafa}
.upload-zone:hover{border-color:#aaa;background:#f0f0f0}
.upload-zone.dragover{border-color:#333;background:#f0f0f0}
.upload-zone p{font-size:14px;color:#666}
.upload-zone p strong{color:#1a1a1a}
.upload-zone.loaded{border-color:#0F6E56;background:#E1F5EE}
.upload-zone.loaded p{color:#085041}
#file-input{display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:background 0.12s}
.btn:hover{background:#333}
.btn:disabled{background:#ccc;cursor:not-allowed}
.status{margin-top:1.25rem;padding:12px 14px;border-radius:8px;font-size:13px;display:none}
.status.info{background:#EEF2FF;color:#1e3a8a}
.status.success{background:#E1F5EE;color:#085041}
.status.error{background:#FAECE7;color:#4A1B0C}
.progress{height:4px;background:#e0e0e0;border-radius:4px;margin-top:12px;overflow:hidden;display:none}
.progress-bar{height:100%;background:#1a1a1a;border-radius:4px;transition:width 0.3s;width:0%}
.last-update{font-size:12px;color:#999;text-align:center;margin-top:1rem}
</style>
</head>

<div class="card">
  <h1>🔄 Aggiorna Giacenze</h1>
  <p class="sub">Carica il file Excel da AdHoc per aggiornare le giacenze per tutti i rappresentanti.</p>

  <div class="step">
    <p class="step-label">1. Seleziona il file Excel</p>
    <div class="upload-zone" id="drop-zone">
      <p><strong>Tocca o trascina qui</strong><br>il file Stampa_saldi_articoli.xlsx</p>
      <input type="file" id="file-input" accept=".xlsx,.xls">
    </div>
  </div>

  <div class="step">
    <p class="step-label">2. Pubblica</p>
    <button class="btn" id="publish-btn" disabled>Pubblica aggiornamento</button>
  </div>

  <div class="progress" id="progress">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
  <div class="status" id="status"></div>
  <p class="last-update" id="last-update"></p>
</div>

function getVariante(p) {
  var d = p.d.toUpperCase(), c = p.c.toUpperCase(), macro = p.macro, tipo = p.tipo;
  if(macro==='Corrugar' && tipo==='Rotoli'){
    var l = (d.indexOf('25M')>=0||d.indexOf('M 25')>=0||d.indexOf('M25')>=0)?' 25m':' 50m';
    if(d.indexOf('GIALLO')>=0||c.indexOf('19C')===0) return 'Giallo'+l;
    if(d.indexOf('BLU IMQ')>=0) return ((d.indexOf('C/T')>=0||d.indexOf('T.LO')>=0)?'Blu IMQ c/tirello':'Blu IMQ')+l;
    if(d.indexOf('GRIGIO')>=0) return 'Grigio'+l;
    if(d.indexOf('NERO')>=0)   return 'Nero'+l;
    if(d.indexOf('ROSSO')>=0)  return 'Rosso'+l;
    if(d.indexOf('VERDE')>=0)  return (d.indexOf('FASTWEB')>=0?'Verde Fastweb':'Verde')+l;
    return p.d.substring(0,30);
  }
  if(macro==='Corrugar' && tipo==='Barre'){
    var col = d.indexOf('NERO')>=0?'Nero':(d.indexOf('ROSSO')>=0?'Rosso':'Grigio');
    var res = d.indexOf('750N')>=0?'750N':'450N';
    var lun = (d.indexOf(' 3M')>=0||d.indexOf('M.3')>=0||d.slice(-2)==='3M')?'3m':'6m';
    return res+' '+col+' '+lun;
  }
  if(macro==='Corrugar' && tipo==='Rotoli Drenaggio'){
    var lun = (d.indexOf('25M')>=0||d.indexOf('M25')>=0||d.indexOf('M 25')>=0)?'25m':'50m';
    if(d.indexOf('DRENOFILTER')>=0) return 'Drenofilter '+lun;
    if(d.indexOf('DRENOCOR')>=0)    return 'Drenocor '+lun;
    return p.d.substring(0,25);
  }
  if(macro==='Corrugar' && tipo==='Barre Drenaggio'){
    var lun=(d.indexOf(' 3M')>=0||d.indexOf('M.3')>=0)?'3m':'6m';
    return (d.indexOf('DRENOBAR')>=0?'Drenobar ':'')+lun;
  }
  if(macro==='Polier' && tipo==='Barre Gas'){
    var s=d.indexOf('S5')>=0?'S5':(d.indexOf('S8')>=0?'S8':'');
    var lun=d.indexOf('12M')>=0||d.indexOf('12 M')>=0?'12m':'6m';
    return s+(d.indexOf('RC')>=0?' RC':'')+' '+lun;
  }
  if(macro==='Polier' && tipo==='Rotoli Gas'){
    var s=d.indexOf('S5')>=0?'S5':(d.indexOf('S8')>=0?'S8':'');
    var m=d.match(/(\d+)\s*M\b/); var lun=m?m[0].replace(' ','').toLowerCase():'';
    return s+(d.indexOf('RC')>=0?' RC':'')+' '+lun;
  }
  if(macro==='Polier' && (tipo==='Barre PE100'||tipo==='Rotoli PE100'||tipo==='Rotoli RC2')){
    var pn=d.match(/PN\s*(\d+[\.,]?\d*)/); var pns=pn?'PN'+pn[1]:'';
    var lun=c.slice(-1)==='D'||d.indexOf('12M')>=0?'12m':'6m';
    if(d.indexOf('10,3')>=0||d.indexOf('10.3')>=0) lun='10,3m';
    if(d.indexOf('11,8')>=0||d.indexOf('11.8')>=0) lun='11,8m';
    var rc=d.indexOf('RC2')>=0?' RC2':(d.indexOf('RC1')>=0?' RC1':(d.indexOf('RC')>=0?' RC':''));
    var ad=d.indexOf(' AD')>=0||d.indexOf('AD ')>=0?' AD':'';
    if(tipo==='Rotoli RC2'){var isb=c.indexOf('06B')===0;return (pns+' RC2 '+(isb?'Barra':'Rotolo')+' '+lun).trim();}
    if(tipo==='Rotoli PE100'){var m2=d.match(/(\d+)\s*M\b/);return (pns+rc+' '+(m2?m2[0].replace(' ','').toLowerCase():'100m')).trim();}
    return (pns+rc+ad+' '+lun).trim();
  }
  if(macro==='Polier' && tipo==='Rotoli Idropolier'){
    var pn=d.match(/PN\s*(\d+)/); var m=d.match(/(\d+)\s*M\b/);
    return ((pn?'PN'+pn[1]:'')+' '+(m?m[0].replace(' ','').toLowerCase():'')).trim();
  }
  if(macro==='Polier' && (tipo==='Rotoli BD IIP'||tipo==='Rotoli BD Irriga')){
    var pn=d.match(/PN\s*(\d+)/); var m=d.match(/(\d+)\s*M\b/);
    return ((pn?'PN'+pn[1]:'')+' '+(m?m[0].replace(' ','').toLowerCase():'')).trim();
  }
  if(macro==='Polier' && tipo==='Monotubo'){
    var rig=c.indexOf('RIG')>=0?' Rig':'';
    var sdr=d.match(/SDR\s*(\d+[\.,]?\d*)/); var sdrs=sdr?'SDR'+sdr[1]+rig:'';
    var col=d.indexOf('NERO')>=0?'Nero':(d.indexOf('REDLINE')>=0||d.indexOf('ROSSO')>=0?'Rosso':'');
    var m=d.match(/(\d{2,4})\s*M\b/); var lun=m?m[0].replace(' ','').toLowerCase():'';
    return [col,sdrs,lun].filter(Boolean).join(' ');
  }
  if(macro==='Monopipe'||macro==='Tripplo'){
    var sn=d.match(/SN\s*(\d+)/);
    var lun=(d.indexOf(' 3M')>=0||d.indexOf('M.3')>=0||d.slice(-2)==='3M')?'3m':'6m';
    return ((sn?'SN'+sn[1]:'')+' '+lun).trim();
  }
  if(macro==='Kingcor'){
    var sn=d.match(/SN\s*(\d+)/);
    var lun=d.indexOf(' 3M')>=0||d.indexOf('M.3')>=0?'3m':'6m';
    return sn?(('SN'+sn[1]+' '+lun).trim()):p.d.substring(0,30);
  }
  if(macro==='Superfluid'){
    var sn=d.match(/SN\s*(\d+)/);
    var lun=d.indexOf('3M')>=0||d.indexOf('M.3')>=0?'3m':'6m';
    var ex=(d.indexOf('F4S')>=0?' F4S':'')+(d.indexOf('F6N')>=0?' F6N':'')+(d.indexOf('TNT')>=0?' TNT':'');
    return ((sn?'SN'+sn[1]:'')+ex+' '+lun).trim();
  }
  if(macro==='SediciPlus'){
    var sn=d.match(/SN\s*(\d+)/);
    var lun=d.indexOf('3M')>=0||d.indexOf('M.3')>=0?'3m':'6m';
    var ex=(d.indexOf('F4S')>=0?' F4S':'')+(d.indexOf('F6N')>=0?' F6N':'');
    return ((sn?'SN'+sn[1]:'')+ex+' '+lun).trim();
  }
  return p.d.substring(0,30);
}

function processExcel(buffer) {
  var wb = XLSX.read(new Uint8Array(buffer), {type:'array'});
  var ws = wb.Sheets[wb.SheetNames[0]];
  var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
  var products = [];
  for(var i=1; i<rows.length; i++){
    var row = rows[i];
    var c = String(row[0]||'').trim();
    if(!c || !LISTA[c]) continue;
    var info = LISTA[c];
    var aterra = parseFloat(row[8]||0)||0;
    var ordinato = parseFloat(row[11]||0)||0;
    products.push({c:c, d:String(row[7]||'').trim(), um:'ML',
      i:Math.round(aterra), l:Math.round(ordinato),
      macro:info.macro, tipo:info.tipo, diam:info.diam});
  }
  // Aggiungi variante
  for(var j=0; j<products.length; j++) products[j].var = getVariante(products[j]);
  // Dedup varianti
  var groups = {};
  for(var k=0; k<products.length; k++){
    var p=products[k], key=p.macro+'|'+p.tipo+'|'+p.diam+'|'+p.var;
    if(!groups[key]) groups[key]=[];
    groups[key].push(p);
  }
  for(var key in groups){
    if(groups[key].length>1) groups[key].forEach(function(p){p.var=p.d;});
  }
  return products;
}

function buildDataJS(products) {
  var lines = products.map(function(p){
    var d=p.d.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/'/g,"\\'");
    var c=p.c.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/'/g,"\\'");
    var v=p.var.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/'/g,"\\'");
    return '{c:"'+c+'",d:"'+d+'",i:'+p.i+',l:'+p.l+',"macro":"'+p.macro+'","tipo":"'+p.tipo+'","diam":"'+p.diam+'","var":"'+v+'"}';
  });
  return 'var DATA=[\n'+lines.join(',\n')+'\n];';
}

function setProgress(pct, msg, type) {
  var bar = document.getElementById('progress-bar');
  var prog = document.getElementById('progress');
  var st = document.getElementById('status');
  prog.style.display = 'block';
  bar.style.width = pct + '%';
  st.style.display = 'block';
  st.className = 'status ' + (type||'info');
  st.textContent = msg;
}

async function getCurrentSHA() {
  var r = await fetch('https://api.github.com/repos/'+GITHUB_USER+'/'+GITHUB_REPO+'/contents/'+GITHUB_FILE, {
    headers:{'Authorization':'token '+GITHUB_TOKEN,'Accept':'application/vnd.github.v3+json'}
  });
  var data = await r.json();
  return {sha: data.sha, content: atob(data.content.replace(/\n/g,''))};
}

async function publishToGitHub(newDataJS, dataStr) {
  setProgress(40, 'Scarico template attuale...', 'info');
  var current = await getCurrentSHA();
  var html = current.content;

  setProgress(60, 'Aggiorno i dati...', 'info');
  html = html.replace(/var DATA=\[[\s\S]*?\];/, newDataJS);
  html = html.replace(/Ultimo aggiornamento: <strong[^>]*>[^<]*<\/strong>/, 
    'Ultimo aggiornamento: <strong id="update-date">'+dataStr+'</strong>');

  setProgress(80, 'Pubblico su GitHub...', 'info');
  var encoded = btoa(unescape(encodeURIComponent(html)));
  var r = await fetch('https://api.github.com/repos/'+GITHUB_USER+'/'+GITHUB_REPO+'/contents/'+GITHUB_FILE, {
    method:'PUT',
    headers:{'Authorization':'token '+GITHUB_TOKEN,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body: JSON.stringify({message:'Aggiornamento giacenze '+dataStr, content:encoded, sha:current.sha})
  });
  return r.status === 200 || r.status === 201;
}

document.getElementById('drop-zone').addEventListener('click', function(){
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', function(e){
  if(e.target.files[0]) loadFile(e.target.files[0]);
});
var dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', function(e){e.preventDefault();dz.classList.add('dragover');});
dz.addEventListener('dragleave', function(){dz.classList.remove('dragover');});
dz.addEventListener('drop', function(e){
  e.preventDefault(); dz.classList.remove('dragover');
  if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

function loadFile(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    fileData = e.target.result;
    dz.classList.add('loaded');
    dz.querySelector('p').innerHTML = '✓ <strong>'+file.name+'</strong><br>File caricato, pronto per la pubblicazione';
    document.getElementById('publish-btn').disabled = false;
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById('publish-btn').addEventListener('click', async function(){
  if(!fileData) return;
  this.disabled = true;
  try {
    setProgress(20, 'Elaboro il file Excel...', 'info');
    var products = processExcel(fileData);
    if(!products.length) throw new Error('Nessun articolo trovato nel file. Verifica che sia il file corretto.');
    setProgress(30, 'Trovati '+products.length+' articoli...', 'info');
    var dataJS = buildDataJS(products);
    var now = new Date();
    var dataStr = now.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+now.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    var ok = await publishToGitHub(dataJS, dataStr);
    if(ok) {
      setProgress(100, '✓ Aggiornamento completato! I rappresentanti vedranno i nuovi dati tra 1-2 minuti.', 'success');
      document.getElementById('last-update').textContent = 'Ultimo aggiornamento: '+dataStr;
      localStorage.setItem('lastUpdate', dataStr);
    } else {
      throw new Error('Errore nella pubblicazione su GitHub. Riprova.');
    }
  } catch(err) {
    setProgress(0, '✗ '+err.message, 'error');
    document.getElementById('progress').style.display='none';
  }
  this.disabled = false;
});

// Mostra ultimo aggiornamento salvato
var lu = localStorage.getItem('lastUpdate');
if(lu) document.getElementById('last-update').textContent = 'Ultimo aggiornamento: '+lu;
</script>
</body>
</html>

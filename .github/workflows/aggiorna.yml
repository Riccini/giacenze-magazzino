name: Aggiorna Giacenze

on:
  push:
    paths:
      - 'Stampa_saldi*.xlsx'
      - 'Stampa_portafoglio*.xlsx'
      - 'Lista Articoli per consultazione.xlsx'
  workflow_dispatch:

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install openpyxl

      - name: Genera e pubblica pagine (con retry automatico)
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          for i in 1 2 3 4 5; do
            python aggiorna_giacenze.py
            python aggiorna_monitor_produzione.py
            # ordini aperti per il piano di carico: se fallisce, le altre pagine si pubblicano lo stesso
            python genera_ordini_json.py || echo "ordini.json non generato"

            git add index.html monitor_produzione.html verifica_disponibilita.html
            if [ -f ordini.json ]; then git add ordini.json; fi
            git commit -m "Aggiornamento giacenze $(date '+%d/%m/%Y %H:%M')" || echo "Nessuna modifica da salvare"

            if git push; then
              echo "Push riuscito al tentativo $i"
              break
            fi

            echo "Push rifiutato (probabile esecuzione parallela). Risincronizzo e rigenero (tentativo $i)..."
            git fetch origin main
            git reset --hard origin/main
            sleep 3
          done
